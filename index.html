<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SEA PEOPLE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;background:#2e8ee4;font-family:Arial,Helvetica,sans-serif;font-weight:bold}
#game{position:fixed;inset:0;overflow:hidden;touch-action:none;
 background:linear-gradient(180deg,#45a3f3 0%,#3597ee 55%,#2e8ee4 100%)}
#dots{position:absolute;inset:0;width:100%;height:100%;opacity:.5;pointer-events:none}
#world{position:absolute;left:0;top:0;width:3000px;height:2000px;transform-origin:0 0;will-change:transform}
#islandWrap{position:absolute;left:0;top:0}
#mapImg{position:absolute;left:0;top:0;width:100%;height:100%;display:block;filter:drop-shadow(0 3px 0 rgba(20,80,150,.22))}
#svgLayer{position:absolute;left:0;top:0;overflow:visible}
#cv{position:absolute;left:0;top:0}
/* ---------- UI ---------- */
.ui{position:absolute;z-index:20}
#topbar{left:50%;transform:translateX(-50%);top:max(8px,env(safe-area-inset-top));height:60px;background:#fff;border-radius:34px;
 box-shadow:0 3px 10px rgba(20,60,120,.25);display:flex;align-items:center;padding:0 6px 0 4px;gap:4px;max-width:96vw}
#ringWrap{position:relative;width:54px;height:54px;flex:0 0 auto;cursor:pointer}
#ring{position:absolute;inset:0;border-radius:50%}
#ringIn{position:absolute;inset:5px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
#ringPct{font-size:15px;color:#2c9c34}
#ringLbl{font-size:7.5px;color:#8aa4bd;margin-top:1px}
.stat{display:flex;align-items:center;gap:3px;color:#33475e;font-size:16px;padding:0 4px;white-space:nowrap}
.stat img{width:22px;height:22px}
#coinBox{display:flex;flex-direction:column;align-items:center;line-height:1;min-width:74px}
#coinLine{display:flex;align-items:center;gap:4px}
#coins{font-size:28px;color:#33475e}
#rate{font-size:11px;color:#2f7fd6;margin-top:2px}
#storeBtn{position:relative;width:48px;height:48px;border-radius:50%;background:#8a00c9;border:none;margin-left:2px;flex:0 0 auto;
 box-shadow:0 3px 0 #5d0088;cursor:pointer;display:flex;align-items:center;justify-content:center}
#storeBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #5d0088}
#dotRed{position:absolute;top:-2px;right:-2px;width:16px;height:16px;border-radius:50%;background:#ff2d2d;border:2.5px solid #fff;display:none}
#capTab{left:50%;transform:translateX(-50%);top:calc(max(8px,env(safe-area-inset-top)) + 66px);background:#fff;border-radius:10px;
 padding:4px 8px 5px;box-shadow:0 2px 6px rgba(20,60,120,.2);width:min(230px,60vw)}
#capBar{height:8px;border-radius:4px;background:#e3ecf5;overflow:hidden;margin-top:3px}
#capFill{height:100%;width:0%;background:#3ec93e;border-radius:4px}
#capTxt{font-size:10px;color:#5a728c;text-align:center;line-height:1}
#menuBtn{left:10px;top:calc(max(8px,env(safe-area-inset-top)) + 74px);width:44px;height:44px;border-radius:50%;background:#fff;border:none;
 box-shadow:0 2px 6px rgba(20,60,120,.25);font-size:20px;color:#33475e;cursor:pointer}
#islPill{left:10px;top:calc(max(8px,env(safe-area-inset-top)) + 126px);background:#ff5fa8;color:#fff;border-radius:14px;
 padding:5px 11px;font-size:13px;box-shadow:0 2px 6px rgba(20,60,120,.25)}
#zoomBox{right:10px;top:calc(max(8px,env(safe-area-inset-top)) + 74px);display:flex;flex-direction:column;gap:8px}
.zbtn{width:42px;height:42px;border-radius:50%;background:#fff;border:none;box-shadow:0 2px 6px rgba(20,60,120,.25);
 font-size:24px;color:#33475e;cursor:pointer;line-height:1}
.zbtn:active{background:#e8f2ff}
#sendBtn{left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));width:min(86vw,560px);height:64px;
 border-radius:18px;background:linear-gradient(#ffe38a,#f4d35e 55%,#eec94a);border:none;color:#6b4d00;font-size:26px;letter-spacing:1px;
 box-shadow:0 6px 0 #c79b28,0 10px 16px rgba(0,0,0,.28);cursor:pointer}
#sendBtn:active{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 #c79b28,0 6px 10px rgba(0,0,0,.25)}
#hint{left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:#fff;color:#33475e;
 border-radius:14px;padding:8px 14px;font-size:13px;box-shadow:0 2px 8px rgba(20,60,120,.25);max-width:80vw;text-align:center;
 opacity:0;transition:opacity .35s;pointer-events:none}
#toast{left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));background:#ff3b3b;color:#fff;
 border-radius:14px;padding:8px 14px;font-size:13px;box-shadow:0 2px 8px rgba(120,0,0,.3);max-width:80vw;text-align:center;
 opacity:0;transition:opacity .25s;pointer-events:none}
/* ---------- sheets ---------- */
.scrim{position:absolute;inset:0;background:rgba(10,40,80,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;background:#f2f6fb;border-radius:22px 22px 0 0;
 transform:translateY(105%);transition:transform .28s ease;max-height:76vh;display:flex;flex-direction:column;
 box-shadow:0 -6px 24px rgba(0,0,0,.3)}
.sheet.on{transform:translateY(0)}
.shead{background:#8a00c9;border-radius:22px 22px 0 0;color:#fff;padding:12px 16px 10px;flex:0 0 auto}
.stitle{font-size:20px;display:flex;align-items:center;justify-content:space-between}
.sclose{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);border:none;color:#fff;font-size:18px;cursor:pointer}
.scoins{display:flex;align-items:center;gap:6px;font-size:16px;margin-top:6px}
.scoins img{width:20px;height:20px}
.tabs{display:flex;gap:6px;margin-top:10px}
.tab{flex:1;padding:8px 0;border-radius:10px;background:rgba(255,255,255,.25);color:#fff;font-size:13px;border:none;cursor:pointer}
.tab.sel{background:#fff;color:#8a00c9}
.sbody{overflow-y:auto;padding:10px 12px calc(14px + env(safe-area-inset-bottom));flex:1 1 auto}
.row{background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:9px;box-shadow:0 1px 4px rgba(20,60,120,.12);
 display:flex;align-items:center;gap:10px}
.ricon{width:42px;height:42px;border-radius:10px;background:#f3e9fb;display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 auto}
.rmain{flex:1 1 auto;min-width:0}
.rname{font-size:15px;color:#33475e}
.rdesc{font-size:11.5px;color:#7b8fa6;font-weight:normal;margin-top:2px;line-height:1.25}
.rlvl{font-size:11px;color:#a08ac0;margin-top:2px}
.buy{flex:0 0 auto;min-width:92px;padding:9px 8px;border-radius:11px;border:none;background:#2fbf3f;color:#fff;font-size:14px;
 box-shadow:0 3px 0 #1d8a2a;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 #1d8a2a}
.buy.off{background:#c3ccd6;box-shadow:0 3px 0 #9aa6b2;color:#eef2f6;pointer-events:none}
.buy img{width:16px;height:16px}
.dline{background:#fff;border-radius:12px;padding:9px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;
 font-size:13.5px;color:#33475e;box-shadow:0 1px 4px rgba(20,60,120,.12)}
.dline b{color:#2c9c34;font-size:14px}
.dlabel{color:#7b8fa6;font-weight:normal;font-size:12px}
#gdpBigBar{height:12px;border-radius:6px;background:#e3ecf5;overflow:hidden;margin:2px 0 10px}
#gdpBigFill{height:100%;background:#3ec93e;width:100%}
/* ---------- cards ---------- */
#card{position:absolute;inset:0;z-index:40;background:rgba(10,40,80,.55);display:none;align-items:center;justify-content:center}
#cardBox{background:#fff;border-radius:22px;padding:26px 24px;width:min(84vw,380px);text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4)}
#cardTitle{font-size:24px;color:#8a00c9;margin-bottom:6px}
#cardSub{font-size:14px;color:#5a728c;font-weight:normal;margin-bottom:18px;line-height:1.35}
#cardBtn{background:linear-gradient(#ffe38a,#f4d35e 55%,#eec94a);border:none;border-radius:14px;padding:14px 26px;font-size:19px;
 color:#6b4d00;box-shadow:0 5px 0 #c79b28;cursor:pointer}
#cardBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #c79b28}
#settingsBody{font-size:15px;color:#7b8fa6;text-align:center;padding:34px 0 44px}
.londonLabel{position:absolute;color:#fff;font-size:13px;letter-spacing:2px;text-shadow:0 1px 3px rgba(0,0,0,.45);
 transform:translate(-50%,-50%);pointer-events:none}
</style>
</head>
<body>
<div id="game">
 <canvas id="dots"></canvas>
 <div id="world">
   <div id="islandWrap"><img id="mapImg" alt=""><div id="shopLayer"></div><div class="londonLabel" id="londonLbl">LONDON</div></div>
   <canvas id="cv"></canvas>
 </div>

 <div id="topbar" class="ui">
   <div id="ringWrap"><div id="ring"></div><div id="ringIn"><span id="ringPct">100%</span><span id="ringLbl">GDP</span></div></div>
   <div class="stat"><img id="adIcon" alt=""><span id="adCnt">0</span></div>
   <div class="stat" id="coinBox"><div id="coinLine"><img id="coinIcon" alt=""><span id="coins">0</span></div><span id="rate">0.0 /SEC</span></div>
   <div class="stat"><span style="font-size:19px">&#127796;</span><span id="natCnt">10,000</span></div>
   <button id="storeBtn"><svg width="26" height="26" viewBox="0 0 26 26"><path d="M4 9 L6 4 H20 L22 9 Z" fill="#fff"/><rect x="5" y="10" width="16" height="12" rx="2" fill="#fff"/><rect x="10" y="15" width="6" height="7" fill="#8a00c9"/></svg><div id="dotRed"></div></button>
 </div>
 <div id="capTab" class="ui"><div id="capTxt">0 / 5,000</div><div id="capBar"><div id="capFill"></div></div></div>

 <button id="menuBtn" class="ui">&#9776;</button>
 <div id="islPill" class="ui">ISLAND 1</div>
 <div id="zoomBox" class="ui"><button class="zbtn" id="zin">+</button><button class="zbtn" id="zout">&minus;</button></div>

 <div id="hint" class="ui"></div>
 <div id="toast" class="ui"></div>
 <button id="sendBtn" class="ui">SEND BOAT</button>

 <div class="scrim" id="scrimStore"></div>
 <div class="sheet" id="storeSheet">
   <div class="shead">
     <div class="stitle">STORE <button class="sclose" data-close="store">&#10005;</button></div>
     <div class="scoins"><img id="coinIcon2" alt=""><span id="sCoins">0</span></div>
     <div class="tabs"><button class="tab sel" data-tab="housing">HOUSING</button><button class="tab" data-tab="helpers">HELPERS</button><button class="tab" data-tab="research">RESEARCH</button></div>
   </div>
   <div class="sbody" id="storeBody"></div>
 </div>

 <div class="scrim" id="scrimInfo"></div>
 <div class="sheet" id="infoSheet">
   <div class="shead"><div class="stitle">ISLAND DETAILS <button class="sclose" data-close="info">&#10005;</button></div></div>
   <div class="sbody" id="infoBody"></div>
 </div>

 <div class="scrim" id="scrimSet"></div>
 <div class="sheet" id="setSheet">
   <div class="shead"><div class="stitle">SETTINGS <button class="sclose" data-close="set">&#10005;</button></div></div>
   <div class="sbody"><div id="settingsBody">Coming soon</div></div>
 </div>

 <div id="card">
   <div id="cardBox">
     <div id="cardTitle"></div>
     <div id="cardSub"></div>
     <button id="cardBtn"></button>
   </div>
 </div>
</div>

/* ---------- geometry (map px, picture is 1218x660) ---------- */
var MW=1218, MH=660;
var LCX=MW*0.5255, LCY=MH*0.5455;      // London (shop grid centre)
var TBX=MW*0.493, TBY=MH*0.403;        // Tower Bridge on the river
var ILX=330, ILY=170, ISX=29, ISQ=26;  // island half-extents / sand inset
var SQ5=Math.sqrt(5);
var _u=TBX-LCX,_v=TBY-LCY;
var RS=(-_u+2*_v)/SQ5;                 // river centreline cross coord (through bridge)
var RTB=(2*_u+_v)/SQ5;                 // bridge position along river axis
var rWIG=function(t){var x=(t-RTB)/45;return 7*Math.sin(x)+3.5*Math.sin(x*1.6+0.8);};
var rHW=function(t){return 12+3*Math.sin(t/50+0.4);};
function inRiver(px,py){               // map coords -> on river?
  var u=px-LCX,v=py-LCY,t=(2*u+v)/SQ5,s=(-u+2*v)/SQ5;
  if(Math.abs(t-RTB)>440)return false;
  if(Math.hypot(u,v)<62)return false;  // palace stays clear
  return Math.abs(s-RS-rWIG(t))<rHW(t);
}
function superDist(u,v,A,B){           // signed distance to wobbly iso "rounded square"
  u=Math.abs(u)/A; v=Math.abs(v)/B;
  var m=Math.max(u,v),n=Math.min(u,v);
  if(m<1)return (m-1)*Math.min(n,1-m);
  var dx=u>=v?u-1:0,dy=v>u?v-1:0;
  return Math.hypot(dx,dy)*(Math.min(A,B)+0.5*(Math.max(A,B)-Math.min(A,B)));
}
function landDist(px,py){
  var d=superDist(px-LCX,py-LCY,ILX,ILY);
  var wob=9*Math.sin(px/87+.7)*Math.sin(py/63+2.1)+5*Math.sin(px/41+4)*Math.sin(py/97+1.3);
  return d-wob;
}
/* collision mask = island silhouette incl sand band, 406x220 alpha PNG */
var MSK_W=406,MSK_H=220,maskData=null;
function maskAt(mx,my){
  if(!maskData)return landDist(mx,my)<=0;
  var ii=clamp(Math.floor(mx*MSK_W/MW),0,MSK_W-1);
  var jj=clamp(Math.floor(my*MSK_H/MH),0,MSK_H-1);
  return maskData[jj*MSK_W+ii]>127;
}
function isBuildable(mx,my){return maskAt(mx,my)&&!inRiver(mx,my);}

var NAMES=["Starting Island","Coastal Village","Forest Island","River Island","Mountain Island","Mining Island","Industrial Island","Large Settlement","Developed Island","Major City Island","Industrial Region","Advanced Island","Megacity Island","Advanced Civilization","Final Island"];
var HELP_NAMES=["Basic Helper","Worker","Machine","Automated Unit","Network Node","Processing Core","Advanced Core","AI Node","Mega System","Planetary System"];
var S_=function(n){return Math.pow(3.049,n-1);};
var gdpOf=function(n){return n===15?6e12:Math.round(1e6*S_(n));};
var houseCap=function(L){return L>0?5000*Math.pow(3,L-1):0;};
var helpCap=function(L,S){return L>0?10*Math.pow(3.2,L-1)*S:0;};
var houseCost=function(L,S){return Math.ceil(800*Math.pow(4.5,L)*S);};
var helpCost=function(L,S){return Math.ceil(100*Math.pow(4,L)*S);};
var resCost=function(L,S,k){return Math.ceil((k===0?250:300)*Math.pow(2.5,L)*S);};
function fmt(n){
  n=Math.floor(n);
  if(n<100000)return n.toLocaleString('en-US');
  var U=[[1e12,'T'],[1e9,'B'],[1e6,'M'],[1e3,'K']];
  for(var i=0;i<U.length;i++){
    if(n>=U[i][0]){var x=n/U[i][0];return (x<10?x.toFixed(2):(x<100?x.toFixed(1):x.toFixed(0)))+U[i][1];}
  }
  return String(n);
}
function fmtRate(r){return r<100?(Math.round(r*10)/10).toFixed(1):fmt(Math.floor(r));}

var G={island:1,coins:0,adepts:0,transit:0,housing:[1,0,0,0],helpers:[1,0,0,0],research:[0,0],
       gdpStart:gdpOf(1),gdpLeft:gdpOf(1),boats:[],runners:[],shopCount:0,complete:false,lastRate:0};
function H_total(){var a=0;for(var i=0;i<4;i++)a+=houseCap(G.housing[i]);return a;}
function helperCapTotal(){var a=0,S=S_(G.island);for(var i=0;i<4;i++)a+=helpCap(G.helpers[i],S);return a;}
function breedRate(){return 0.01*(1+0.10*G.research[1]);}
function grossRate(){return G.adepts*0.05*S_(G.island)*(1+0.10*G.research[0]);}
function natives(){return Math.ceil(10000*Math.pow(2,G.island-1)*(G.gdpLeft/G.gdpStart));}
function hintTxt(){
  var H=H_total();
  if(G.adepts<1)return "Tap SEND BOAT to bring adepts to the island";
  if(G.adepts>=0.97*H)return "Housing is full - build more housing";
  if(grossRate()>helperCapTotal())return "Helpers are the bottleneck - buy System Helpers";
  return "Adepts are the bottleneck - send boats and let them breed";
}
function affordable(){
  var S=S_(G.island);
  for(var i=0;i<4;i++){
    if(G.housing[i]<10&&G.coins>=houseCost(G.housing[i],S))return true;
    if(G.helpers[i]<10&&G.coins>=helpCost(G.helpers[i],S))return true;
  }
  for(var k=0;k<2;k++)if(G.research[k]<25&&G.coins>=resCost(G.research[k],S,k))return true;
  return false;
}

var game=$('game'),world=$('world'),cv=$('cv'),ctx=cv.getContext('2d');
var wrap=$('islandWrap'),mapImg=$('mapImg');
var vw=0,vh=0,dpr=Math.min(window.devicePixelRatio||1,2);
var margin=0,zoom=1,camX=0,camY=0,camTX=0,camTY=0,imgW=0,imgH=0,ox=0,oy=0,whCss=0;
mapImg.src=ASSETS.map;
var oxL=0, oyT=0;   // island offset inside world (css px)
function relayout(){
  vw=game.clientWidth; vh=game.clientHeight;
  imgW=clamp(1.7*vw,760,(vh-260)*MW/MH);
  imgH=imgW*MH/MW;
  margin=Math.max(0.35*vw,150);
  var ww=imgW+2*margin;
  whCss=Math.max(imgH+2*margin*0.6,imgH+240);
  world.style.width=ww+'px'; world.style.height=whCss+'px';
  oxL=margin; oyT=(whCss-imgH)/2;
  wrap.style.left=oxL+'px'; wrap.style.top=oyT+'px';
  wrap.style.width=imgW+'px'; wrap.style.height=imgH+'px';
  svg.setAttribute('viewBox','0 0 '+MW+' '+MH);
  cv.width=Math.round(ww*dpr); cv.height=Math.round(whCss*dpr);
  cv.style.width=ww+'px'; cv.style.height=whCss+'px';
  $('londonLbl').style.left=(LCX/MW*100)+'%';
  $('londonLbl').style.top=((LCY+50)/MH*100)+'%';
  applyCam();
}
function applyCam(){
  var tx=vw/2-camX*zoom, ty=vh/2-camY*zoom;
  tx=Math.min(tx,0); tx=Math.max(tx,vw-world.offsetWidth*zoom);
  ty=Math.min(ty,0); ty=Math.max(ty,vh-whCss*zoom);
  camTX=tx; camTY=ty;
  world.style.transform='translate('+tx+'px,'+ty+'px) scale('+zoom+')';
}
function setZoom(z,cxClient,cyClient){
  z=clamp(z,1,2.2); if(Math.abs(z-zoom)<1e-4)return;
  var wx=(cxClient-camTX)/zoom, wy=(cyClient-camTY)/zoom;
  zoom=z;
  camX=wx-(cxClient-vw/2)/zoom; camY=wy-(cyClient-vh/2)/zoom;
  applyCam();
}
function centerOnLondon(){camX=oxL+LCX/imgW*MW*0+ (oxL+LCX*(imgW/MW)); camY=oyT+LCY*(imgH/MH); applyCam();}
/* canvas transform: world css px -> canvas px, with y-squash so sprites stay upright */
function setTx(){
  var s=dpr*zoom, sq=(MH/imgH)*(imgW/MW);
  ctx.setTransform(s,0,0,s*sq,-oxL*s,-oyT*s+LCY*(1-sq)*s);
}
function mx2wx(mx){return oxL+mx*(imgW/MW);}
function my2wy(my){return oyT+my*(imgH/MH);}

/* ---------- SVG landmarks & shops (isometric, generated by JS) ---------- */
function el(tag,attrs,parent){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function P(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}
/* iso box: footprint half-steps hx along e1=(2,1), hy along e2=(-2,1), height hz; base centre (cx,cy) */
function isoBox(g,cx,cy,hx,hy,hz,ct,cl,cr){
  var p=function(hxi,hyj,hzz){return [cx+2*hx*hxi-2*hy*hyj, cy+hx*hxi+hy*hyj-hz*hzz];};
  var A=p(-1,-1,1),B=p(1,-1,1),C=p(1,1,1),D=p(-1,1,1);
  var B0=p(1,-1,0),C0=p(1,1,0),D0=p(-1,1,0);
  el('polygon',{points:P(A)+' '+P(B)+' '+P(C)+' '+P(D),fill:ct},g);
  el('polygon',{points:P(B)+' '+P(C)+' '+P(C0)+' '+P(B0),fill:cr},g);
  el('polygon',{points:P(D)+' '+P(C)+' '+P(C0)+' '+P(D0),fill:cl},g);
  return {p:p};
}
function pyramid(g,base,top,colorA,colorB){
  var b=[base.p(-1,-1,1),base.p(1,-1,1),base.p(1,1,1),base.p(-1,1,1)];
  var tip=[(b[0][0]+b[2][0])/2,b[0][1]-top];
  el('polygon',{points:P(b[0])+' '+P(b[1])+' '+P(tip),fill:colorA},g);
  el('polygon',{points:P(b[1])+' '+P(b[2])+' '+P(tip),fill:colorB},g);
  el('polygon',{points:P(b[2])+' '+P(b[3])+' '+P(tip),fill:colorA},g);
  el('polygon',{points:P(b[3])+' '+P(b[0])+' '+P(tip),fill:colorB},g);
}
function buildPalace(){
  var g=el('g',{},svg), cx=LCX, cy=LCY;
  var hall=isoBox(g,cx,cy-8,26,10,16,'#efe3c8','#d9c9a4','#e6d8b8');
  var hp=hall.p;
  var r1=hp(-1,-1,1),r2=hp(1,-1,1),r3=hp(1,1,1),r4=hp(-1,1,1);
  var m1=[(r1[0]+r4[0])/2,r1[1]-9],m2=[(r2[0]+r3[0])/2,r2[1]-9];
  el('polygon',{points:P(r1)+' '+P(r2)+' '+P(m2)+' '+P(m1),fill:'#c9b78f'},g);
  el('polygon',{points:P(r4)+' '+P(r3)+' '+P(m2)+' '+P(m1),fill:'#dccca6'},g);
  for(var i=-0.7;i<=0.71;i+=0.35){
    var w1=hp(i,1,0.25),w2=hp(i,1,0.8);
    el('line',{x1:w1[0],y1:w1[1],x2:w2[0],y2:w2[1],stroke:'#8d7a52','stroke-width':2},g);
  }
  var bt=isoBox(g,cx-2*20-2*8+2,cy+20-8+8-16,5,5,44,'#efe3c8','#cdbb92','#e2d2ae');
  pyramid(bt,16,'#caa741','#e3c04f');
  var cf=bt.p(1,1,0.82);
  el('circle',{cx:cf[0],cy:cf[1],r:3.4,fill:'#fff',stroke:'#8d7a52','stroke-width':1},g);
  var vt=isoBox(g,cx+2*24+2*6-2,cy+24-6-10,6,6,26,'#efe3c8','#cdbb92','#e2d2ae');
  pyramid(vt,9,'#b98a4a','#d3a45c');
  return g;
}
function buildBridge(){
  var g=el('g',{},svg);
  /* river axis dir (2,-1)/sqrt5 ; cross dir (-1,-2)... use map-space vectors */
  var ax=2/SQ5, ay=-1/SQ5;          // along river (up-right on screen? y down: (2,-1) means right+up)
  var bx=-1/SQ5*2*0+(-(-1)), by=0;  // placeholder
  // crossing direction = perpendicular in the t/s basis: s increases toward (-1?, ) -> derive:
  // t=(2u+v)/SQ5, s=(-u+2v)/SQ5 => du/ds=-1/SQ5? invert: u=(2t-s)/SQ5, v=(t+2s)/SQ5
  // so d/dt=(2,1)/SQ5 (screen up-down positive y!) and d/ds=(-1,2)/SQ5
  var DX=2/SQ5, DY=1/SQ5;           // along river axis in map px (y down)
  var CX2=-1/SQ5, CY2=2/SQ5;        // across river
  var hw=rHW(RTB)+6;                // half span across

  [-1,1].forEach(function(sg){
    var top1=topPt(-AL+3,sg*hw*0.55), top2=topPt(AL-3,sg*hw*0.55);

function findShopSlots(count){
  var slots=[];
  for(var i=-4;i<=4;i++)for(var j=-4;j<=4;j++){
    var mx=LCX+20*i-20*j, my=LCY+10*i+10*j;
    if(Math.abs(mx-LCX)<70&&Math.abs(my-LCY)<34)continue;      // palace
    if(Math.hypot(mx-TBX,my-TBY)<52)continue;                  // bridge
    if(!isBuildable(mx,my))continue;
    slots.push({mx:mx,my:my,d:Math.hypot(mx-LCX,(my-LCY)*2)});
  }
  slots.sort(function(a,b){return a.d-b.d;});
  return slots.slice(0,count);
}

/* ---------- boat routes (straight lines along iso axes) ---------- */
var DIRS=[[2,-1],[-2,1],[-2,-1],[2,1]].map(function(d){var l=Math.hypot(d[0],d[1]);return [d[0]/l,d[1]/l];});
function findRoute(){
  for(var tries=0;tries<24;tries++){
    var d=DIRS[Math.floor(Math.random()*4)];
    var per=[-d[1],d[0]];
    var off=Math.random()*150-75;
    var aimx=LCX+d[0]*30+per[0]*off, aimy=LCY+d[1]*30+per[1]*off;
    // march from far out at sea toward aim until hitting island edge
    var x=aimx+d[0]*430, y=aimy+d[1]*430, found=null;
    for(var st=0;st<430;st+=2){
      x-=d[0]*2; y-=d[1]*2;
      if(x<-20||x>MW+20||y<-20||y>MH+20)break;
      if(maskAt(x,y)){found={x:x,y:y};break;}
    }
    if(!found)continue;
    if(Math.hypot(found.x-LCX,found.y-LCY)>300)continue;
    // approach line outward must be free of land for >=170px
    var clear=0;
    for(var st2=2;st2<=330;st2+=2){
      var qx=found.x+d[0]*st2, qy=found.y+d[1]*st2;
      if(qx<-30||qx>MW+30||qy<-30||qy>MH+30){clear=st2;break;}
      if(maskAt(qx,qy)){clear=st2-2;break;}
      clear=st2;
    }
    if(clear<170)continue;
    var dist=Math.min(160+Math.random()*140,clear);
    return {d:d,from:[found.x+d[0]*dist,found.y+d[1]*dist],to:found};
  }
  return null;
}

/* ---------- entities ---------- */
function sendBoat(){
  if(G.complete)return;
  var room=Math.floor(H_total()-G.adepts-G.transit);
  if(room<1){toast("Housing is full - build more housing!");return;}
  if(G.boats.length>=30)return;
  var r=findRoute();
  if(!r){toast("No clear route to the beach right now");return;}
  var load=Math.min(4,room);
  G.boats.push({d:r.d,fx:r.from[0],fy:r.from[1],tx:r.to[0],ty:r.to[1],
    prog:0,len:Math.hypot(r.to[0]-r.from[0],r.to[1]-r.from[1]),
    state:'sail',load:load,dropped:0,timer:0,alpha:1,bob:Math.random()*6.28,xcur:r.from[0],ycur:r.from[1]});
  G.transit+=load;
}
function spawnRunner(mx,my){
  if(!shopDefs.length)return;
  var sh=shopDefs[Math.floor(Math.random()*shopDefs.length)];
  G.runners.push({x:mx,y:my,tx:sh.mx+(Math.random()*8-4),ty:sh.my+7+(Math.random()*4-2),sp:55+Math.random()*30,hop:Math.random()*6.28,shop:sh});
}
function bumpShop(sh){sh.el.classList.remove('bump');void sh.el.getBoundingClientRect();sh.el.classList.add('bump');}
function updateEntities(dt){
  var i,b;
  for(i=G.boats.length-1;i>=0;i--){
    b=G.boats[i]; b.bob+=dt*6;
    if(b.state==='sail'){
      b.prog+=120*dt;
      if(b.prog>=b.len){b.prog=b.len;b.state='beach';b.timer=0;}
      b.xcur=b.fx+b.d[0]*b.prog; b.ycur=b.fy+b.d[1]*b.prog;
    }else if(b.state==='beach'){
      b.timer-=dt;
      if(b.timer<=0&&b.dropped<b.load){
        b.timer=0.18;b.dropped++;G.transit--;
        spawnRunner(b.tx-b.d[0]*12,b.ty-b.d[1]*12);
      }
      if(b.dropped>=b.load&&b.timer<=0)b.state='leave';
      b.xcur=b.fx+b.d[0]*b.prog; b.ycur=b.fy+b.d[1]*b.prog;
    }else{
      b.prog+=90*dt; b.alpha-=dt/0.9;
      b.xcur=b.tx+b.d[0]*(b.prog-b.len); b.ycur=b.ty+b.d[1]*(b.prog-b.len);
      if(b.alpha<=0)G.boats.splice(i,1);
    }
  }
  for(i=G.runners.length-1;i>=0;i--){
    var ru=G.runners[i];
    var dx=ru.tx-ru.x,dy=ru.ty-ru.y,dl=Math.hypot(dx,dy);
    if(dl<3){G.runners.splice(i,1);G.adepts+=1;bumpShop(ru.shop);continue;}
    var mv=Math.min(ru.sp*dt,dl);
    ru.x+=dx/dl*mv; ru.y+=dy/dl*mv; ru.hop+=dt*12;
  }
}

/* ---------- sprite drawing (canvas) ---------- */
function boatSprite(b){
  var key=(b.d[1]<0)?'boatNE':'boatNW';   // bow up-right / bow up-left picture
  var mir=(key==='boatNE')?(b.d[0]<0):(b.d[0]>0);
  var im=IMG[key];
  return mir?mirrorCanvas(im,key+'M'):im;
}
function drawBoat(b,sc,alpha){
  var c=boatSprite(b); if(!c||!c.width)return;
  var w=c.width*sc,h=c.height*sc;
  var bobY=(b.state==='sail')?Math.sin(b.bob)*1.3:0;
  ctx.save();ctx.globalAlpha=alpha;
  ctx.drawImage(c,b.xcur-w/2,b.ycur-h+8*sc+bobY,w,h);
  ctx.restore();
}
function drawCrewIn(b,sc,alpha,n){
  var im=IMG.crew;if(!n||!im||!im.width)return;
  var cw=im.width*sc,ch=im.height*sc;
  var per=[[-14,-16],[0,-19],[14,-16],[-7,-25]];
  var bobY=(b.state==='sail')?Math.sin(b.bob)*1.3:0;
  ctx.save();ctx.globalAlpha=alpha;
  for(var i=0;i<n&&i<4;i++){
    var px=b.xcur+per[i][0]*sc,py=b.ycur+per[i][1]*sc+bobY+Math.sin(b.bob+i*1.7)*0.9;
    ctx.drawImage(im,px-cw/2,py-ch,cw,ch);
  }
  ctx.restore();
}
function drawTube(b,sc,alpha){
  var c=boatSprite(b);if(!c||!c.width)return;
  var sx=(c.width*0.48)|0,sy=(c.height*0.42)|0;
  var sw=c.width-sx,sh=c.height-sy;
  var w=c.width*sc,h=c.height*sc;
  var bx=b.xcur-w/2,by=b.ycur-h+8*sc;
  ctx.save();ctx.globalAlpha=alpha;
  ctx.drawImage(c,sx,sy,sw,sh,bx+sx*sc,by+sy*sc,sw*sc,sh*sc);
  ctx.restore();
}
function drawWake(b,sc,alpha){
  if(b.state!=='sail')return;
  ctx.save();ctx.globalAlpha=alpha*0.45;ctx.fillStyle='#ffffff';
  for(var k=1;k<=6;k++){
    var wx=b.xcur-b.d[0]*(16+k*12),wy=b.ycur-b.d[1]*(16+k*12)+7;
    ctx.beginPath();ctx.arc(wx,wy,(6.5-k*0.7)*sc,0,6.283);ctx.fill();
  }
  ctx.restore();
}
function drawRunner(r,sc,alpha){
  var dy=r.ty-r.y;
  var base=(dy<-1.5)?'adB':'adF';                 // facing away when running up-screen
  var ph=((Math.floor(r.hop)%2===0)?'a':'b');
  var key=base+ph,im=IMG[key];if(!im||!im.width)return;
  var left=(r.tx-r.x)<-1;
  var c=left?mirrorCanvas(im,key+'M'):im;
  var w=c.width*sc,hh=c.height*sc;
  var hopY=-Math.abs(Math.sin(r.hop))*2.6;
  ctx.save();ctx.globalAlpha=alpha;
  ctx.drawImage(c,r.x-w/2,r.y-hh+5+hopY,w,hh);
  ctx.restore();
}

  for(var i=0;i<4;i++){
    bindBuy('hb'+i,(function(ii){return function(){doBuyHousing(ii);};})(i));
    bindBuy('sb'+i,(function(ii){return function(){doBuyHelper(ii);};})(i));}
  bindBuy('rb0',function(){doBuyRes(0);});
  bindBuy('rb1',function(){doBuyRes(1);});
}
function doBuyHousing(i){
  var S=S_(G.island),L=G.housing[i];if(L>=10)return;
  var c=houseCost(L,S);if(G.coins<c){toast('Not enough coins');return;}
  G.coins-=c;G.housing[i]=L+1;addShop();updateUI();
}
function doBuyHelper(i){
  var S=S_(G.island),L=G.helpers[i];if(L>=10)return;
  var c=helpCost(L,S);if(G.coins<c){toast('Not enough coins');return;}
  G.coins-=c;G.helpers[i]=L+1;updateUI();
}
function doBuyRes(k){
  var S=S_(G.island),R=G.research[k];if(R>=25)return;
  var c=resCost(R,S,k);if(G.coins<c){toast('Not enough coins');return;}
  G.coins-=c;G.research[k]=R+1;updateUI();
}
function updateUI(){
  var pct=G.gdpStart>0?clamp(G.gdpLeft/G.gdpStart,0,1):0;
  setRing(pct);
  $('ringPct').textContent=Math.ceil(pct*100)+'%';
  $('adCnt').textContent=fmt(Math.floor(G.adepts));
  $('coins').textContent=fmt(G.coins);
  $('rate').textContent=fmtRate(G.lastRate)+' /SEC';
  $('natCnt').textContent=fmt(natives());
  var H=H_total();
  $('capTxt').textContent=fmt(Math.floor(G.adepts))+' / '+fmt(H);
  $('capFill').style.width=clamp(H>0?G.adepts/H*100:0,0,100)+'%';
  $('islPill').textContent='ISLAND '+G.island;
  $('dotRed').style.display=affordable()?'block':'none';
  $('sCoins').textContent=fmt(G.coins);
  if(sheetOpen==='store')renderStore();
  else if(sheetOpen==='info')renderInfo();
  refreshHint();
}

/* ---------- main loop ---------- */
var lastTs=0,uiT=0;
function tick(dt){
  if(!G.complete){
    var H=H_total();
    if(H>0)G.adepts+=G.adepts*breedRate()*(1-G.adepts/H)*dt;
    var rate=Math.min(grossRate(),helperCapTotal());
    G.lastRate=rate;
    var mined=Math.min(rate*dt,G.gdpLeft);
    G.gdpLeft-=mined;G.coins+=mined;
    if(G.gdpLeft<=0.5){G.gdpLeft=0;G.complete=true;showCard();}
  }
  updateEntities(dt);
}
function drawScene(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  var sc=imgW/MW,i;
  setTx();
  for(i=0;i<G.boats.length;i++)drawWake(G.boats[i],sc,G.boats[i].alpha);
  var items=[];
  for(i=0;i<G.boats.length;i++)items.push({y:G.boats[i].ycur,t:0,o:G.boats[i]});
  for(i=0;i<G.runners.length;i++)items.push({y:G.runners[i].y,t:1,o:G.runners[i]});
  items.sort(function(a,b){return a.y-b.y;});
  for(i=0;i<items.length;i++){
    var it=items[i];
    if(it.t===0){var b=it.o,left=Math.max(0,Math.min(b.load-b.dropped,4));
      drawBoat(b,sc,b.alpha);drawCrewIn(b,sc,b.alpha,left);drawTube(b,sc,b.alpha);}
    else drawRunner(it.o,sc,1);
  }
}
function frame(ts){
  var dt=Math.min((ts-lastTs)/1000,0.05);lastTs=ts;
  tick(dt);drawScene();
  if(ts-uiT>200){uiT=ts;updateUI();}
  requestAnimationFrame(frame);
}

/* ---------- island completion ---------- */
function showCard(){
  $('card').style.display='flex';
  if(G.island>=15){
    $('cardTitle').textContent='All 15 islands mined!';
    $('cardSub').textContent='You drained every last coin of GDP from the archipelago.';
    $('cardBtn').textContent='PLAY AGAIN';
  }else{
    $('cardTitle').textContent='Island '+G.island+' complete!';
    $('cardSub').textContent=NAMES[G.island-1]+' is empty. Next stop: '+NAMES[G.island]+'.';
    $('cardBtn').textContent='NEXT ISLAND';
  }
}
function nextIsland(){
  if(G.island>=15)G.island=1;else G.island++;
  G.coins=0;G.adepts=0;G.transit=0;G.housing=[1,0,0,0];G.helpers=[1,0,0,0];G.research=[0,0];
  G.gdpStart=gdpOf(G.island);G.gdpLeft=G.gdpStart;
  G.boats=[];G.runners=[];G.complete=false;G.lastRate=0;
  shopDefs.forEach(function(s){s.el.remove();});shopDefs=[];G.shopCount=0;addShop();
  $('card').style.display='none';
  zoom=1;centerOnLondon();updateUI();
}

/* ---------- input ---------- */
function initInput(){
  var pts={},gesture=null,pinchD=0,pinchZ=1,lastX=0,lastY=0;
  function ids(){return Object.keys(pts);}
  game.addEventListener('pointerdown',function(e){
    pts[e.pointerId]={x:e.clientX,y:e.clientY};
    var n=ids().length;
    if(n===1){gesture='pan';lastX=e.clientX;lastY=e.clientY;}
    else if(n===2){gesture='pinch';
      var a=pts[ids()[0]],b=pts[ids()[1]];
      pinchD=Math.hypot(a.x-b.x,a.y-b.y);pinchZ=zoom;}
  });
  window.addEventListener('pointermove',function(e){
    if(!(e.pointerId in pts))return;
    pts[e.pointerId]={x:e.clientX,y:e.clientY};
    if(gesture==='pan'){
      var dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;
      camX-=dx/zoom;camY-=dy/zoom;applyCam();
    }else if(gesture==='pinch'&&ids().length>=2){
      var a=pts[ids()[0]],b=pts[ids()[1]];
      var d=Math.hypot(a.x-b.x,a.y-b.y);
      setZoom(pinchZ*d/Math.max(1,pinchD),(a.x+b.x)/2,(a.y+b.y)/2);
    }
  });
  window.addEventListener('pointerup',function(e){
    delete pts[e.pointerId];
    if(ids().length===0)gesture=null;
    else if(ids().length===1){gesture='pan';var p=pts[ids()[0]];lastX=p.x;lastY=p.y;}
  });
  window.addEventListener('pointercancel',function(e){
    delete pts[e.pointerId];if(ids().length===0)gesture=null;});
  game.addEventListener('wheel',function(e){
    e.preventDefault();
    setZoom(zoom*(e.deltaY<0?1.12:1/1.12),e.clientX,e.clientY);
  },{passive:false});
  $('zin').onclick=function(){setZoom(zoom*1.25,vw/2,vh/2);};
  $('zout').onclick=function(){setZoom(zoom/1.25,vw/2,vh/2);};
  window.addEventListener('keydown',function(e){
    var st=30/zoom;
    if(e.key==='ArrowLeft')camX-=st;
    else if(e.key==='ArrowRight')camX+=st;
    else if(e.key==='ArrowUp')camY-=st;
    else if(e.key==='ArrowDown')camY+=st;
    else if(e.key==='+'||e.key==='=')setZoom(zoom*1.2,vw/2,vh/2);
    else if(e.key==='-'||e.key==='_')setZoom(zoom/1.2,vw/2,vh/2);
    else return;
    applyCam();
  });
  $('sendBtn').addEventListener('click',function(){sendBoat();});
  $('storeBtn').onclick=function(){openSheet('store');};
  $('menuBtn').onclick=function(){openSheet('set');};
  $('ringWrap').onclick=function(){openSheet('info');};
  Array.prototype.forEach.call(document.querySelectorAll('[data-close]'),function(btn){
    btn.onclick=closeSheets;});
  Array.prototype.forEach.call(document.querySelectorAll('.scrim'),function(sc){sc.onclick=closeSheets;});
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(tb){
    tb.onclick=function(){
      Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(o){o.classList.remove('sel');});
      tb.classList.add('sel');storeTab=tb.getAttribute('data-tab');renderStore();};});
  $('cardBtn').onclick=nextIsland;
}

/* ---------- boot ---------- */
function boot(){
  $('adIcon').src=ASSETS.adFa;
  $('coinIcon').src=ASSETS.coin;
  $('coinIcon2').src=ASSETS.coin;
  relayout();
  buildPalace();buildBridge();addShop();
  centerOnLondon();
  initInput();
  var dots=$('dots'),dctx=dots.getContext('2d');
  function drawDots(){
    dots.width=vw;dots.height=vh;
    dctx.fillStyle='rgba(255,255,255,.5)';
    for(var y=12;y<vh;y+=26)for(var x=((Math.round(y/26)%2)?13:0);x<vw;x+=26){
      dctx.beginPath();dctx.arc(x,y,1.1,0,6.283);dctx.fill();}
  }
  drawDots();
  window.addEventListener('resize',function(){relayout();drawDots();});
  updateUI();
  lastTs=performance.now();
  requestAnimationFrame(frame);
}
boot();
</script>
</body>
